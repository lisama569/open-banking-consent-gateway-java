server.port=0

# 令牌有效期（秒）
gateway.token-ttl-seconds=3600
# 授权默认有效期（秒）
gateway.consent-ttl-seconds=86400
# 凭据轮换过渡期（秒）：过渡期内新旧凭据均可用
gateway.credential-grace-seconds=300
# 通知投递限流：每窗口每客户端最大投递次数
gateway.delivery-rate-limit=10
# 限流窗口长度（秒）
gateway.delivery-rate-window-seconds=1
# 投递失败最大重试次数
gateway.delivery-max-retries=3
